name: Windows app

# Builds the Windows desktop app (pywebview + PyInstaller, one windowed .exe)
# and runs it with --smoke: server starts headless, /api/status, baselines,
# analysis, web UI and the WebView2 backend are checked, then it exits.
# Pull requests and main: the exe is uploaded as a workflow artifact.
# Tags v*: the exe is attached to the GitHub Release as
# forza-pitwall-<version>-windows-x64.exe (the release is created if missing).

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Version
        id: version
        run: |
          $version = uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            Write-Error "tag $env:GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: uv sync --locked --no-dev --group desktop

      - name: Build exe
        run: uv run --no-sync pyinstaller --noconfirm --clean packaging/windows/pitwall.spec

      - name: Smoke test
        env:
          PITWALL_DATA_DIR: ${{ runner.temp }}\pitwall-smoke
        run: |
          # A windowed exe detaches from the console: wait for it explicitly
          # and read its log file for the output.
          $p = Start-Process -FilePath dist\forza-pitwall.exe -ArgumentList '--smoke' -Wait -PassThru
          Get-Content "$env:PITWALL_DATA_DIR\pitwall-desktop.log"
          "exit code: $($p.ExitCode)"
          (Get-Item dist\forza-pitwall.exe).Length / 1MB | ForEach-Object { 'size: {0:N1} MB' -f $_ }
          exit $p.ExitCode

      - name: Name the exe
        run: Rename-Item dist\forza-pitwall.exe "forza-pitwall-${{ steps.version.outputs.version }}-windows-x64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: forza-pitwall-windows-x64
          path: dist/forza-pitwall-*-windows-x64.exe
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: forza-pitwall-windows-x64
          path: dist

      - name: Create the release if missing and upload the exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          FILE: dist/forza-pitwall-${{ needs.build.outputs.version }}-windows-x64.exe
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" "$FILE" --clobber
