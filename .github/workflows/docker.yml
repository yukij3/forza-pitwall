name: Docker

# Pull requests: build the image for linux/amd64 and check that it starts.
# Tags v*: build linux/amd64 + linux/arm64 and push to GitHub Container Registry
# as ghcr.io/<owner>/<repo>:<version>, :<major>.<minor> and :latest.

on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: forza-pitwall:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and query /api/status
        run: |
          docker run -d --name pitwall -p 5301:5301 forza-pitwall:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5301/api/status; then
              exit 0
            fi
            sleep 1
          done
          docker logs pitwall
          exit 1

  release:
    name: Build and push multi-arch image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action lowercases the name, as GHCR requires.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
