# Example Docker Compose setup for Pitwall.
#
#   1. Set PITWALL_PUBLIC_HOST below to this machine's LAN IP address.
#   2. mkdir -p data
#   3. docker compose up -d --build
#   4. Open http://<this machine's IP>:5301 in a browser.
#
# See docs/install.md for NAS setups, firewall notes and troubleshooting.

services:
  pitwall:
    # Builds the image from this repository. To use a published release image
    # instead, replace "build: ." with:
    #   image: ghcr.io/OWNER/forza-pitwall:latest
    build: .
    ports:
      - "5300:5300/udp" # Data Out telemetry from the game (UDP)
      - "5301:5301"     # Web UI and API
    volumes:
      - ./data:/data    # SQLite database and raw packet recordings
    environment:
      # The LAN IP address of the machine running this container, i.e. the
      # address you enter in the game under Data Out. Pitwall shows it in the
      # UI's setup hint; it does not change what Pitwall listens on.
      PITWALL_PUBLIC_HOST: "192.168.x.x"
    # The image runs as UID:GID 1000:1000. If ./data belongs to another user
    # (on Unraid, typically 99:100), set that user here instead.
    # user: "1000:1000"
    restart: unless-stopped
